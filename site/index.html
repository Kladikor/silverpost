<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Silverpost</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.3s ease, color 0.3s ease;
      padding-bottom: 60px;
    }

    header {
      position: sticky;
      top: 0;
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      z-index: 100;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-title {
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.15rem;
      cursor: pointer;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .icon-btn:hover {
      color: var(--accent-color);
      transform: scale(1.05);
    }

    .profile-card {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin: 15px 0 10px 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-color);
    }

    .profile-info {
      flex: 1;
    }

    .profile-name {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .profile-bio {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-top: 4px;
    }



    main {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 10px 0;
    }

    .post-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .post-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
    }

    .author-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    .author-name {
      font-weight: 600;
      font-size: 0.95rem;
    }


    .post-image-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .post-image {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      display: block;
    }

    .post-caption {
      padding: 0 16px 12px 16px;
      font-size: 0.92rem;
      line-height: 1.4;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .form-input, .form-textarea {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    .form-textarea {
      resize: vertical;
      min-height: 70px;
    }

    .btn-primary {
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }
    body { padding-inline: 12px; }
    .logo-container svg { color: var(--accent-color); }
    .icon-btn { display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; }
    .profile-avatar, .author-avatar {
      display: grid; place-items: center; flex: none;
      color: var(--accent-color); background: var(--bg-color);
    }
    .author-avatar { border: 1px solid var(--border-color); }
    .post-image-wrapper a { display: block; width: 100%; }
    .post-caption { padding-top: 12px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .empty { text-align: center; padding: 32px 16px; color: var(--text-sub); }
    .empty h2 { margin-bottom: 6px; color: var(--text-main); font-size: 1rem; }
    .empty button { margin-top: 16px; }
    dialog.modal-card { margin: auto; color: var(--text-main); }
    dialog:not([open]), [hidden] { display: none !important; }
    dialog::backdrop { background: rgb(0 0 0 / 70%); }
    .modal-card p { color: var(--text-sub); line-height: 1.45; }
    .btn-primary { display: inline-block; text-decoration: none; text-align: center; background: #0369a1; }
    .btn-primary:hover { background: #075985; }
    .upload-preview { max-height: 240px; object-fit: contain; }
    .post-tools, .comment-form { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .post-tools, .comments { padding: 10px 16px; }
    .post-tools a, .post-tools button { color: var(--accent-color); }
    .comments { border-top: 1px solid var(--border-color); }
    .comments li { margin: 6px 0; overflow-wrap: anywhere; list-style: none; }
    .comment-form input { flex: 1; min-width: 120px; }
    .post-note, .site-status { color: var(--text-sub); font-size: .85rem; }
    .site-status { width: 100%; max-width: 680px; }
    #profileForm > * + * { margin-top: 12px; }
    :focus-visible { outline: 2px solid var(--accent-color); outline-offset: 3px; }
  </style>
</head>
<body>
  <header>
    <div class="logo-container">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="3.5"/>
      </svg>
      <h1 class="logo-title">Silverpost</h1>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" data-add-photo type="button" aria-label="Add a photo">⊞</button>
      <button class="icon-btn" id="editProfile" type="button" aria-label="Edit profile">♙</button>
      <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle light and dark theme">☾</button>
    </div>
  </header>

  <section class="profile-card" aria-label="Gallery profile">
    <div class="profile-header">
      <span class="profile-avatar" aria-hidden="true">◈</span>
      <div class="profile-info">
        <p class="profile-name" id="profileName">Silverpost</p>
        <p class="profile-bio" id="profileBio">A photo feed to share with friends.</p>
      </div>
    </div>
  </section>

  <main aria-label="Photo feed">
    <!-- GALLERY -->
  </main>

  <dialog class="modal-card" id="composer" aria-labelledby="composerTitle">
    <div class="modal-title">
      <span id="composerTitle">New photo</span>
      <form method="dialog"><button class="icon-btn" aria-label="Close">×</button></form>
    </div>
    <div class="form-group">
      <label for="photo">Preview a JPEG, PNG or WebP</label>
      <input class="form-input" id="photo" type="file" accept="image/jpeg,image/png,image/webp">
    </div>
    <div class="form-group">
      <label for="caption">Caption</label>
      <textarea class="form-textarea" id="caption" maxlength="1000"></textarea>
    </div>
    <img class="upload-preview" id="preview" alt="Preview of the selected photo" hidden>
    <p id="photoStatus" role="status">Posts saved here are private to this browser. After saving, you can send the photo from your device or download it for publishing.</p>
    <button class="btn-primary" id="savePost" type="button" disabled>Post on this device</button>
  </dialog>

  <dialog class="modal-card" id="profileEditor" aria-labelledby="profileTitle">
    <div class="modal-title">
      <span id="profileTitle">Edit local profile</span>
      <form method="dialog"><button class="icon-btn" aria-label="Close">×</button></form>
    </div>
    <form id="profileForm">
      <div class="form-group">
        <label for="name">Display name</label>
        <input class="form-input" id="name" maxlength="50" required>
      </div>
      <div class="form-group">
        <label for="bio">Bio</label>
        <textarea class="form-textarea" id="bio" maxlength="160"></textarea>
      </div>
      <p>Profile changes stay on this device.</p>
      <button class="btn-primary" type="submit">Save profile</button>
    </form>
  </dialog>
  <p class="site-status" id="siteStatus" role="status"></p>
  <script src="app.js" defer></script>
</body>
</html>
