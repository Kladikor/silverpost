<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Silverpost</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0f172a;
      --panel: #1e293b;
      --line: #334155;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      font-family: system-ui, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --background: #f1f5f9;
        --panel: #fff;
        --line: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0369a1;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      max-width: 680px;
      padding: 0 16px 48px;
      background: var(--background);
      color: var(--text);
    }
    header { padding: 24px 0 16px; }
    h1 { margin: 0; font-size: 1.5rem; }
    h1 span { color: var(--accent); }
    header p, .empty { margin: 8px 0; color: var(--muted); }
    main { display: grid; gap: 20px; }
    figure {
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }
    figure a { display: block; background: #000; }
    figure a:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
    img { width: 100%; max-height: 75vh; object-fit: contain; display: block; }
    figcaption { padding: 12px 16px; overflow-wrap: anywhere; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1><span aria-hidden="true">◈</span> Silverpost</h1>
    <p>A photo gallery to share with friends.</p>
  </header>
  <main aria-label="Photo gallery">
    <!-- GALLERY -->
  </main>
</body>
</html>
